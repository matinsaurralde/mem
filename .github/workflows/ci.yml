name: CI

on:
  push:
    branches: [master]
  # Deliberately unfiltered by base branch. With a `branches: [master]` filter,
  # a pull request targeting anything else gets no CI at all — which silently
  # excluded every stacked PR in this series, the exact review model in use.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Must cover every version pyproject declares support for. Claiming
        # >=3.10 while only testing 3.11/3.12 is an untested promise.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -v

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Catches packaging breakage at PR time instead of at tag time, when the
      # release workflow is the only thing standing between a bad build and PyPI.
      - name: Build distributions
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Verify the installed console script is ours
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          OUT="$(/tmp/verify/bin/mem --version)"
          echo "$OUT"
          case "$OUT" in
            "mem, version "*) ;;
            *) echo "::error::unexpected --version output: $OUT"; exit 1 ;;
          esac

      # The hooks are the entry point for every piece of data mem stores, and
      # they only reach users through the wheel. They used to be looked up at a
      # repo-relative path that no installed wheel has, so `mem init` silently
      # served a stale second copy inlined in cli.py — and the test suite,
      # which always ran from a source checkout, never noticed. Only an
      # install-then-run check can catch that class of bug.
      - name: Verify the wheel ships the shell hooks
        run: |
          for shell in zsh bash fish; do
            OUT="$(/tmp/verify/bin/mem init "$shell")"
            if ! diff <(printf '%s\n' "$OUT") "src/mem/hooks/mem.$shell"; then
              echo "::error::mem init $shell does not match src/mem/hooks/mem.$shell"
              exit 1
            fi
          done
          echo "all three hooks served from the installed wheel"
