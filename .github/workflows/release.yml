name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# A tag pushed twice (or force-moved) must not race two publishes against PyPI.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify version matches tag
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT_VERSION=$(python -c "exec(open('src/mem/__init__.py').read()); print(__version__)")
          echo "Tag: $TAG_VERSION | pyproject.toml: $PKG_VERSION | __init__.py: $INIT_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::Version mismatch! Tag=$TAG_VERSION pyproject.toml=$PKG_VERSION __init__.py=$INIT_VERSION"
            echo "Fix: update both pyproject.toml and src/mem/__init__.py, commit, then re-tag."
            exit 1
          fi

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      # Everything that can fail must fail BEFORE the upload step: a release
      # published to PyPI cannot be replaced, only yanked.
      - name: Smoke-test the built wheel
        run: |
          set -euo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          OUT="$(/tmp/smoke/bin/mem --version)"
          echo "$OUT"
          EXPECTED="mem, version ${GITHUB_REF_NAME#v}"
          if [ "$OUT" != "$EXPECTED" ]; then
            echo "::error::wheel reports '$OUT', expected '$EXPECTED'"
            exit 1
          fi
          /tmp/smoke/bin/mem init zsh > /dev/null
          echo "wheel smoke test passed"

      # TODO: migrate to PyPI Trusted Publishing (pypa/gh-action-pypi-publish
      # with `id-token: write`) to retire the long-lived PYPI_TOKEN secret.
      # Requires configuring the publisher on PyPI first, so it is a deliberate
      # follow-up rather than a silent swap.
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload --skip-existing dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading artifacts only."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes dist/*
          fi

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"

          # -f so an HTTP error is an error: without it curl pipes the error page
          # into shasum and the tap gets a checksum of "404: Not Found".
          SHA=$(curl -fsSL --retry 5 --retry-delay 2 "$TARBALL_URL" | shasum -a 256 | cut -d' ' -f1)
          if [ ${#SHA} -ne 64 ]; then
            echo "::error::refusing to publish a malformed sha256: '$SHA'"
            exit 1
          fi
          echo "Tag: $TAG"
          echo "SHA256: $SHA"

          # Clone the tap repo
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/matinsaurralde/homebrew-tap.git" /tmp/tap
          cd /tmp/tap

          # Update only the release url and sha256 (lines 7-8), not dependency resources.
          # Uses awk to replace only the FIRST url/sha256 pair matching the release pattern.
          awk -v tag_url="$TARBALL_URL" -v sha="$SHA" '
            /url.*github.com\/matinsaurralde\/mem\/archive/ {
              print "  url \"" tag_url "\""
              found_url = 1
              next
            }
            found_url && /sha256/ {
              print "  sha256 \"" sha "\""
              found_url = 0
              next
            }
            { print }
          ' Formula/mem.rb > Formula/mem.rb.tmp
          mv Formula/mem.rb.tmp Formula/mem.rb

          if ! grep -q "$SHA" Formula/mem.rb; then
            echo "::error::awk did not write the new sha256 into Formula/mem.rb"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mem.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "mem ${TAG}"
          git push
