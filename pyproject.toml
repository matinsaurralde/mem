[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-mem"
version = "0.5.0"
description = "Privacy-first CLI that turns shell history into searchable memory"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Matias Insaurralde" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
]
# Upper bounds are deliberate. Unpinned ranges already bit us once: Click 9
# removes `Context.protected_args`, which the implicit-search router depends on,
# so an unconstrained `click` would break the entire CLI on a routine upgrade.
dependencies = [
    "click>=8.1,<9",
    "rich>=13.7,<15",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
# Capped at <0.2 on purpose: 0.2.x reworked the SDK around multimodal
# attachments and has not been validated against mem's guided-generation path.
ai = ["apple-fm-sdk>=0.1.1,<0.2"]
# ruff is pinned to an exact minor. A linter without an upper bound makes CI
# non-deterministic over time: every new release can add default rules that
# turn a green branch red without a single line changing. That is exactly what
# happened here — 0.16.0 enabled BLE001/S110/PLW1510 and flagged 44 pre-existing
# sites. Upgrading ruff is now a deliberate PR, not a surprise.
#
# TODO(0.16): adopt ruff 0.16. Its new BLE001 and S110 rules point straight at
# the `except Exception: pass` in cli.py:262 that hid the dead background sync
# for four months, so they are worth adopting — but only with per-site
# judgement: the broad catch in storage.py:97 (skip a corrupted JSONL line) is
# correct and should get a justified noqa, while the ones swallowing real
# failures should be narrowed.
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.15.5,<0.16",
]

[project.scripts]
# Not `mem.cli:cli` — see src/mem/_entry.py. The indirection is what lets the
# Ctrl+R finder start without importing Click, Rich and Pydantic first.
mem = "mem._entry:main"

[project.urls]
GitHub = "https://github.com/matinsaurralde/mem"

[tool.hatch.build.targets.wheel]
packages = ["src/mem"]

[tool.hatch.build.targets.editable]
packages = ["src/mem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not ai"`: tests marked `ai` drive the REAL Apple Foundation Models
# runtime. They cost seconds per call and their output is non-deterministic,
# so the default suite excludes them. Run them deliberately with `pytest -m ai`.
#
# Branch coverage is on because mem is mostly branching I/O: line coverage
# reports a `try/except` or an `if not path.exists()` as covered after the
# happy path alone, which is exactly the half that never gets tested.
addopts = "-m 'not ai and not perf and not keychain_live' --cov=mem --cov-branch --cov-report=term-missing"
markers = [
    "ai: requires the real on-device Apple Foundation Models runtime (deselected by default)",
    "perf: wall-clock measurement, too machine-dependent to gate a PR (deselected by default)",
    "keychain_live: drives the REAL /usr/bin/security against a throwaway keychain (deselected by default)",
]

[tool.coverage.run]
branch = true
source = ["mem"]

[tool.coverage.report]
# TODO: enable once the follow-up branches land the missing tests.
#       Target: fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
