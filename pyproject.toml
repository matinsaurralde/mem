[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-mem"
version = "0.4.1"
description = "Privacy-first CLI that turns shell history into searchable memory"
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Matias Insaurralde" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
]
# Upper bounds are deliberate. Unpinned ranges already bit us once: Click 9
# removes `Context.protected_args`, which the implicit-search router depends on,
# so an unconstrained `click` would break the entire CLI on a routine upgrade.
dependencies = [
    "click>=8.1,<9",
    "rich>=13.7,<15",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
# Capped at <0.2 on purpose: 0.2.x reworked the SDK around multimodal
# attachments and has not been validated against mem's guided-generation path.
ai = ["apple-fm-sdk>=0.1.1,<0.2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
mem = "mem.cli:cli"

[project.urls]
GitHub = "https://github.com/matinsaurralde/mem"

[tool.hatch.build.targets.wheel]
packages = ["src/mem"]

[tool.hatch.build.targets.editable]
packages = ["src/mem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
